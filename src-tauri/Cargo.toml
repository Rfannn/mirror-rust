[package]
name = "mirror-rust"
version = "1.0.0"
description = "Android screen mirroring and control, powered by scrcpy"
authors = ["Rfan"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mirror_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = "0.14"
png = "0.17"
base64 = "0.22"
