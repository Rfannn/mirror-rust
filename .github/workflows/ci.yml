name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # cargo tauri is a subcommand, so the CLI has to be installed separately.
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The adb and scrcpy binaries ship with the Python repo rather than this
      # one, so fetch them before building.
      - name: Fetch scrcpy binaries
        shell: bash
        run: |
          mkdir -p src-tauri/resources
          base=https://raw.githubusercontent.com/Rfannn/mirrorpy/main
          for file in adb.exe scrcpy.exe scrcpy-server AdbWinApi.dll AdbWinUsbApi.dll \
                      SDL2.dll avcodec-61.dll avformat-61.dll avutil-59.dll \
                      swresample-5.dll libusb-1.0.dll; do
            curl -sSL -o "src-tauri/resources/$file" "$base/$file" || echo "missing $file"
          done
          ls -la src-tauri/resources

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installer
        run: cargo tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Mirror-Rust-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
